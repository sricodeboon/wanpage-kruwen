<!doctype html>
<!-- แม่แบบไอคอนแอป (วาดที่ 512 แล้วให้ tools/make-icons.mjs ย่อด้วย deviceScaleFactor)
     ?v=any (squircle โปร่งใสที่มุม) | apple (เต็มสี่เหลี่ยม — iOS ตัดมุมเอง มุมโปร่งใสจะกลายเป็นสีดำ)
       | maskable (เนื้อหาในวงกลม r=205 — มาสคอตตัดตามวงกลม r=179 แบบเหรียญในแถบหัว) | fav (หัวมาสคอตถึงคาง)
     ไม่มีตัวอักษร · ไม่มีวงกลมลอยเหนือเส้นโค้ง · เหลือง/ม่วง/ชมพู/ส้มเท่านั้น (เขียวมีแค่ชุด/หมวกมาสคอต) -->
<html lang="th">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 512px; height: 512px; background: transparent; overflow: hidden; }
  .ic { position: relative; width: 512px; height: 512px; overflow: hidden; border-radius: 115px;
    background: linear-gradient(135deg, #6d28d9 0%, #a21caf 38%, #e11d74 66%, #ff7a1a 100%); }
  /* ขอบเหลือง 2 เส้น (เส้นหนา + เส้นบางด้านใน) แบบไอคอนเดิม */
  .ring { position: absolute; inset: 22px; border: 10px solid #ffc93c; border-radius: 94px; }
  .ring.in { inset: 42px; border-width: 3px; border-color: rgba(255, 201, 60, .55); border-radius: 76px; }
  .bust { position: absolute; left: 50%; bottom: 0; height: 72%; transform: translateX(-50%); filter: drop-shadow(0 6px 10px rgba(43, 26, 74, .35)); }

  .apple .ic, .maskable .ic { border-radius: 0; }
  .apple .ring { border-radius: 70px; }
  .apple .ring.in { border-radius: 54px; }
  /* maskable: วงนอก r=200 อยู่ในโซนปลอดภัย r=205; มาสคอตย่อ 80% กึ่งกลาง */
  .maskable .ring { inset: 56px; border-radius: 50%; border-width: 8px; }
  .maskable .ring.in { inset: 72px; border-radius: 50%; border-width: 3px; }
  .clip { position: absolute; inset: 0; overflow: hidden; }
  .maskable .clip { inset: 77px; border-radius: 50%; }
  .maskable .bust { height: 90%; }
  /* favicon 48px: หัวถึงคาง เต็มกรอบ ไม่มีเส้นขอบ (เล็กเกินจะอ่านออก) */
  .fav .ic { border-radius: 112px; }
  .fav .ring { display: none; }
  .fav .bust { height: 128%; bottom: auto; top: 2%; filter: none; }
</style>
</head>
<body>
<div class="ic"><div class="ring"></div><div class="ring in"></div><div class="clip"><img class="bust" src="../site/assets/brand/kruwan-bust.png" alt=""></div></div>
<script>
  document.body.className = new URLSearchParams(location.search).get('v') || 'any';
</script>
</body>
</html>
