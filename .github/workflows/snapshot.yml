name: snapshot
on:
  schedule:
    - cron: '0 20 * * 0' # = จันทร์ 03:00 ไทย (cron เป็น UTC)
  workflow_dispatch:
concurrency:
  group: snapshot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/snapshot.mjs
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
      - name: commit ถ้าไฟล์เปลี่ยน
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/snapshot.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: weekly snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
  # push ด้วย GITHUB_TOKEN ไม่ trigger pages.yml เอง จึงเรียกต่อที่นี่
  deploy:
    needs: snapshot
    if: needs.snapshot.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
