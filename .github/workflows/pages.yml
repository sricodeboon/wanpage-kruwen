name: pages
# วันเพจ (ระบบใหม่): เว็บนิ่งล้วน ไม่ต้อง build — คัดเฉพาะไฟล์ที่เว็บใช้ แล้ว deploy ขึ้น GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: เตรียมไฟล์เว็บ
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest css js data assets icons _site/
          rm -f _site/assets/*/PROMPTS.md
          # ให้เบราว์เซอร์โหลดโค้ดใหม่ทุกครั้งที่ deploy
          v=${GITHUB_SHA::8}
          sed -i "s#css/app.css\"#css/app.css?v=$v\"#; s#css/fonts.css\"#css/fonts.css?v=$v\"#; s#js/app.js\"#js/app.js?v=$v\"#" _site/index.html
          sed -i -E "s#(from '\./[^']+\.js)'#\1?v=$v'#g" _site/js/*.js _site/js/engine/*.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
