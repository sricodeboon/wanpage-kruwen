name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: npx playwright install --with-deps chromium
      # CI (ubuntu) คือผู้ตัดสิน golden (goldens.mjs เข้มเฉพาะ linux; เครื่อง dev เตือนอย่างเดียว)
      - run: npm run goldens -- --strict
      - run: npm run e2e
      - name: อัปโหลดภาพที่ต่างจาก golden
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-actual
          path: |
            tests/golden/actual/
            test-results/
            playwright-report/
          if-no-files-found: ignore
