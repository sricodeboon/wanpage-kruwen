<!doctype html>
<html lang="th"><head><meta charset="utf-8"><title>วันเพจ 23 ต.ค. 69</title>
<style>
  :root{--p1:#3b1470;--p2:#5b2a9e;--p3:#7d4bc4;--gold:#d9a93a;--gold2:#f6d983;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1024px;height:1536px;overflow:hidden;background:#efe8fb}
  body{font-family:"Sukhumvit Set","Thonburi",sans-serif;position:relative;color:var(--p1)}
  .bg{position:absolute;inset:0;width:1024px;height:1536px}
  .wrap{position:absolute;inset:0}
  .logo{position:absolute;left:50%;top:12px;height:132px;transform:translateX(-50%);filter:drop-shadow(0 6px 10px #3b147055)}
  .title{position:absolute;left:92px;right:92px;top:152px;height:76px;border-radius:38px;
    background:linear-gradient(180deg,var(--p3),var(--p1));
    border:5px solid var(--gold);box-shadow:0 0 0 3px #fff8,0 10px 24px #3b147066;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:39px;font-weight:700;letter-spacing:.3px;
    text-shadow:0 2px 4px #0006}
  .title::before,.title::after{content:"";position:absolute;top:50%;width:70px;height:4px;background:linear-gradient(90deg,transparent,var(--gold));}
  .title::before{left:-78px}
  .title::after{right:-78px;transform:scaleX(-1)}
  .school{position:absolute;left:150px;right:150px;top:240px;height:54px;border-radius:27px;background:#fff;
    border:3px solid var(--p3);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:var(--p1);
    box-shadow:0 6px 16px #3b147033}
  .loc{position:absolute;left:0;right:0;top:304px;display:flex;align-items:center;justify-content:center;gap:10px;
    font-size:24px;font-weight:600;color:var(--p1)}
  .loc span{background:#ffffffd9;padding:4px 18px;border-radius:20px}
  .photo{position:absolute;border-radius:22px;overflow:hidden;border:6px solid #fff;
    box-shadow:0 0 0 2px var(--p3),0 12px 26px #3b147055;background:#ddd}
  .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .main{left:46px;right:46px;top:352px;height:282px}
  .main img{object-position:50% 72%}
  .s1{left:46px;width:458px;top:650px;height:230px}
  .s2{left:520px;width:458px;top:650px;height:230px}
  .s1 img{object-position:50% 70%}
  .s2 img{object-position:50% 75%}
  .tag{position:absolute;left:14px;bottom:14px;display:flex;align-items:center;gap:8px;padding:5px 18px 5px 6px;border-radius:24px;
    background:linear-gradient(180deg,var(--p3),var(--p1));color:#fff;font-size:21px;font-weight:700;border:2px solid var(--gold2)}
  .tag i{width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center}
  .duty{position:absolute;left:170px;right:170px;bottom:22px;height:104px;border-radius:26px;
    background:linear-gradient(180deg,#5b2a9ef2,#2e0f5cf5);border:4px solid var(--gold);box-shadow:0 0 0 3px #fff6,0 -6px 22px #2e0f5c66}
  .duty h2{position:absolute;left:0;right:0;top:10px;text-align:center;white-space:nowrap;color:var(--gold2);font-size:26px;font-weight:700;text-shadow:0 1px 3px #0008}
  .duty .row{position:absolute;left:0;right:0;top:50px;display:flex;flex-direction:row;justify-content:center;align-items:center;gap:34px}
  .duty .name{font-size:29px;font-weight:700;color:#fff}
  .duty .tel{display:flex;align-items:center;gap:10px;font-size:28px;font-weight:700;color:#fff;letter-spacing:.5px}
</style></head><body>
<img class="bg" src="bg.png" alt="">
<div class="wrap">

  <div class="photo main"><img src="p-main.jpg" alt=""></div>

  <div class="photo s1"><img src="p-field.jpg" alt="">
    <div class="tag"><i><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="9" r="6" fill="#5b2a9e"/><rect x="11" y="13" width="2" height="9" fill="#5b2a9e"/><rect x="6" y="21" width="12" height="2" rx="1" fill="#5b2a9e"/></svg></i>สนามกีฬา / พื้นที่กิจกรรม</div></div>
  <div class="photo s2"><img src="p-farm.jpg" alt="">
    <div class="tag"><i><svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 22V11" stroke="#5b2a9e" stroke-width="2.4" stroke-linecap="round"/><path d="M12 12C12 7 8 4 3 4c0 5 4 8 9 8zM12 10c0-4 3-7 8-7 0 4-3 7-8 7z" fill="#5b2a9e"/><rect x="4" y="20" width="16" height="2.4" rx="1.2" fill="#5b2a9e"/></svg></i>แปลงเกษตรโรงเรียน</div></div>

  <div class="duty">
    <h2>ครูเวรประจำวันที่ 23 ตุลาคม พ.ศ. 2569</h2>
    <div class="row">
      <div class="name">ส.ต.ท.รัชเดช ศรีแก้ว</div>
      <div class="tel"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 006.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 013 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z" fill="#f6d983"/></svg>081-234-5678</div>
    </div>
  </div>
</div>
</body></html>
