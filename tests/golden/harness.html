<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<title>golden harness</title>
<link rel="stylesheet" href="../../site/fonts.css">
<style>html,body{margin:0;background:#fff}canvas{display:block;width:384px;height:576px}</style>
</head><body>
<canvas id="c" width="1536" height="2304"></canvas>
<script type="module">
  // เปิดผ่าน http server ที่รากรีโป: /tests/golden/harness.html#<encodeURIComponent(JSON)>
  // JSON = { tpl, model, logo, photos[] } (พาธอิงรากรีโป) — เสร็จแล้ว body.dataset.done=1 และ window.__png = data URL
  import { mergeTemplate } from '../../site/js/layout.js';
  import { renderOnePage } from '../../site/js/render.js';
  import { ensureFonts } from '../../site/js/fonts.js';

  const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('โหลดไม่ได้: ' + src)); i.src = '/' + src.replace(/^\//, ''); });
  try {
    const job = JSON.parse(decodeURIComponent(location.hash.slice(1)));
    const all = await (await fetch('/site/templates.json')).json();
    const tpl = all.templates.find(t => t.id === job.tpl);
    if (!tpl) throw new Error('ไม่พบแม่แบบ ' + job.tpl);
    const resolved = mergeTemplate(all.common, tpl);
    if (!(await ensureFonts({ timeoutMs: 5000 }))) throw new Error('ฟอนต์ Kanit ไม่พร้อม');
    const [bg, logo, ...photos] = await Promise.all([loadImg('site/' + tpl.file), loadImg(job.logo), ...job.photos.map(loadImg)]);
    const canvas = document.getElementById('c');
    renderOnePage(canvas.getContext('2d'), job.model, resolved, 1.5, { bg, logo, photos });
    window.__png = canvas.toDataURL('image/png');
    document.body.dataset.done = '1';
  } catch (e) {
    document.body.dataset.error = String(e && e.message || e);
  }
</script>
</body></html>
